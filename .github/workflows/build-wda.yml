name: Build WebDriverAgent IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Strip DWARF debug symbols
        run: |
          APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          find "$APP" -type d -name DWARF -print -exec rm -rf {} +

      - name: Thin fat Mach-O binaries to arm64
        run: |
          APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O universal binary"; then
              echo "Thinning $f"
              lipo -thin arm64 "$f" -output "$f.thin" && mv "$f.thin" "$f"
            fi
          done

      - name: Package as unsigned IPA
        run: |
          cd DerivedData/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -r WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: DerivedData/Build/Products/Debug-iphoneos/WebDriverAgent.ipa
